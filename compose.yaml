services:
  suishi:
    build: .
    restart: unless-stopped
    ports:
      - "8910:8910"
      - "127.0.0.1:8911:8911"
    environment:
      SUISHI_TRUSTED_PROXIES: ${SUISHI_TRUSTED_PROXIES:-127.0.0.1/32}
    volumes:
      - suishi-data:/app/runtime
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
volumes:
  suishi-data:
