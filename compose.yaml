# 备注：本程序由AI辅助完成。
# 文件功能用途：定义 Docker Compose 服务、端口和持久存储。
# 注意事项：管理端口默认仅绑定宿主机回环，数据卷须定期备份。
# ============================================================
services:
  suishi:
    build: .
    restart: unless-stopped
    ports:
      - "8910:8910"
      - "127.0.0.1:8911:8911"
    environment:
      SUISHI_TRUSTED_PROXIES: ${SUISHI_TRUSTED_PROXIES:-127.0.0.1/32}
    volumes:
      - suishi-data:/app/runtime
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
volumes:
  suishi-data:
