<html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>邃室SuiShi · 蜜罐管理</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#20304b;font:14px "Microsoft YaHei",sans-serif}header{background:#13223b;color:white;padding:22px 4vw}h1{margin:0;font-size:24px}header p{color:#abbcd6}main{padding:24px 4vw}.cards{display:flex;gap:16px;margin-bottom:20px}.card,section{background:white;border:1px solid #e0e7f0;border-radius:12px;padding:20px}.card{flex:1}.card strong{display:block;font-size:30px;color:#325ee7;margin-top:12px}.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}input,button{padding:10px 14px;border:1px solid #cbd5e1;border-radius:7px}input{width:340px;max-width:100%}button{background:#325ee7;color:white;cursor:pointer}table{border-collapse:collapse;width:100%;white-space:nowrap}td,th{text-align:left;padding:12px;border-bottom:1px solid #edf0f6}td.path{max-width:400px;overflow:hidden;text-overflow:ellipsis}.table{overflow:auto}dialog{width:min(900px,94vw);max-height:85vh;border:0;border-radius:12px;padding:24px}dialog::backdrop{background:#13223b88}pre{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}.close{float:right}#notice{color:#b42318;margin:12px 0}.footer{margin-top:18px;display:flex;align-items:center;gap:14px}
</style>
<header><h1>邃室SuiShi</h1><p>蜜罐访问分析 · WAF 非法请求引流</p></header>
<main><div class="cards"><div class="card">捕获请求<strong id="total">0</strong></div><div class="card">来源 IP<strong id="sources">0</strong></div><div class="card">高风险请求<strong id="high">0</strong></div></div>
<div class="toolbar"><button data-tab="events">访问记录</button><button data-tab="sources">来源画像</button><button data-tab="settings">蜜罐配置</button><button id="simulation-tab">攻击模拟</button></div>
<div id="summary" class="card" style="margin-bottom:20px;line-height:2"></div>
<section id="extra" hidden></section><section id="simulation-view" hidden>
<h2>攻击模拟验证</h2><p>向当前蜜罐内部回放固定测试请求，验证采集、识别和日志关联。模拟不会向外部目标发送请求；每次最多32条，依次执行。</p>
<div class="toolbar"><button id="select-cases">全选场景</button><button id="run-cases">执行选中场景</button><button id="simulation-history">刷新历史</button></div>
<div id="case-list"></div><p id="simulation-notice" role="status"></p><div id="simulation-result"></div><h3>最近30次模拟任务</h3><div id="simulation-runs"></div>
</section><div id="events-view">
<section><div class="toolbar"><input id="query" placeholder="搜索来源 IP、请求路径、WAF 规则"><select id="traffic"><option value="all">全部流量</option><option value="real">真实流量</option><option value="simulation">模拟流量</option></select><select id="risk"><option value="">全部风险</option><option>高</option><option>中</option><option>低</option><option>信息</option></select><select id="size"><option>20</option><option>50</option><option>100</option></select><button id="search">查询</button><button id="refresh">刷新数据</button></div><div class="toolbar"><label>开始时间 <input id="start" type="datetime-local"></label><label>结束时间 <input id="end" type="datetime-local"></label></div><div id="notice" role="status"></div>
<div class="table"><table><thead><tr><th>时间</th><th>来源 IP</th><th>方法</th><th>请求路径</th><th>命中规则</th><th>状态</th><th>详情</th></tr></thead><tbody id="rows"></tbody></table></div>
<div class="footer"><button id="prev">上一页</button><span id="paging"></span><button id="next">下一页</button></div></section></div><p id="global-notice" role="status"></p><p>v0.261115 · 请遵守版权协议。</p></main>
<dialog id="detail"><button class="close" id="close" aria-label="关闭">×</button><h2>请求详情</h2><pre id="payload"></pre></dialog>
<script>
let page=1,pages=1;const $=id=>document.getElementById(id);
function checkSession(response){if(response.status===401){location.replace('/login?reason=expired');throw new Error('登录已失效，请重新登录')}return response}
async function api(path){const r=checkSession(await fetch(path,{cache:'no-store'}));if(!r.ok)throw new Error('请求失败：'+r.status);return r.json()}
async function load(){try{const [stats,data]=await Promise.all([api('/api/stats'),api('/api/events?'+parameters())]);$('total').textContent=stats.total;$('sources').textContent=stats.sources;$('high').textContent=stats.risks.find(r=>r.severity==='高')?.count||0;$('summary').textContent='攻击 TOP5（最近5000条命中记录）：'+stats.attack_top.map(x=>x[0]+' '+x[1]).join(' / ')+' ｜ 来源 TOP5：'+stats.top_ips.map(x=>x.source_ip+' '+x.count).join(' / ');pages=Math.max(1,Math.ceil(data.total/data.page_size));$('paging').textContent=`第 ${page} / ${pages} 页，共 ${data.total} 条`;$('prev').disabled=page<=1;$('next').disabled=page>=pages;$('rows').replaceChildren();for(const item of data.items){const tr=document.createElement('tr');for(const key of ['time','source_ip','method','path','rule','status']){const td=document.createElement('td');td.textContent=key==='time'?new Date(item[key]).toLocaleString():key==='rule'?(item.simulation_run?'[模拟] ':'')+item.severity+' · '+(item[key]||item.scenario):item[key];if(key==='path')td.className='path';tr.append(td)}const td=document.createElement('td'),b=document.createElement('button');b.textContent='查看';b.onclick=()=>show(item.id);td.append(b);tr.append(td);$('rows').append(tr)}$('notice').textContent=''}catch(e){$('notice').textContent=e.message}}
async function show(id){try{const data=await api('/api/events/'+id);$('payload').textContent=JSON.stringify(data,null,2);$('detail').showModal();let a=$('export');if(!a){a=document.createElement('a');a.id='export';a.textContent='导出此请求 JSON';$('detail').append(a)}a.href='/api/events/'+id+'/export'}catch(e){$('notice').textContent=e.message}}
$('search').onclick=()=>{page=1;load()};$('refresh').onclick=load;$('prev').onclick=()=>{if(page>1){page--;load()}};$('next').onclick=()=>{if(page<pages){page++;load()}};$('close').onclick=()=>$('detail').close();load();

function parameters(){const p=new URLSearchParams({page:String(page),page_size:$('size').value,q:$('query').value,severity:$('risk').value,traffic:$('traffic').value});for(const name of ['start','end'])if($(name).value)p.set(name,new Date($(name).value).toISOString());return p}
async function tab(name){$('events-view').hidden=name!=='events';$('extra').hidden=name==='events';$('global-notice').textContent='';if(name==='events'){load();return}try{if(name==='sources'){const data=await api('/api/sources');$('extra').replaceChildren();const title=document.createElement('h2');title.textContent='来源画像（共 '+data.items.length+' 个来源）';$('extra').append(title);for(const row of data.items){const line=document.createElement('p'),b=document.createElement('button');line.textContent=`${row.source_ip}　请求 ${row.requests}　高风险 ${row.high_risk}　路径 ${row.paths}　首次 ${new Date(row.first_seen).toLocaleString()}　最近 ${new Date(row.last_seen).toLocaleString()}　`;b.textContent='访问轨迹';b.onclick=()=>{ $('query').value=row.source_ip;page=1;tab('events')};line.append(b);$('extra').append(line)}}else{const data=await api('/api/settings');$('extra').innerHTML='<h2>蜜罐配置</h2><div class="toolbar"><label>响应模式 <select id="profile"><option value="adaptive">自适应场景</option><option value="portal">统一门户</option></select></label><label>正文采集上限（字节） <input id="limit" type="number" min="1024" max="1048576"></label><label>读取超时（秒） <input id="timeout" type="number" min="1" max="30"></label><button id="save">保存</button></div><p>识别结果需要结合原始请求核实；正文哈希仅对应已保存字节，截断记录不代表完整请求。</p><hr><h3>历史记录清理</h3><label>删除此时间之前的记录 <input id="before" type="datetime-local"></label> <button id="purge">清理</button><p>清理不可恢复，请先备份。清理后SQLite文件可能保留已分配空间。</p>';$('profile').value=data.profile;$('limit').value=data.body_limit;$('timeout').value=data.read_timeout;$('save').onclick=async()=>{try{await write('/api/settings','PUT','settings',{profile:$('profile').value,body_limit:Number($('limit').value),read_timeout:Number($('timeout').value)});$('global-notice').textContent='配置已保存，下一个请求生效'}catch(e){$('global-notice').textContent=e.message}};$('purge').onclick=async()=>{if(!$('before').value||!confirm('确定删除所选时间之前的记录？请确认已经备份。'))return;try{const r=await write('/api/retention','POST','retention',{before:new Date($('before').value).toISOString()});$('global-notice').textContent='已清理 '+r.deleted+' 条记录'}catch(e){$('global-notice').textContent=e.message}}}}catch(e){$('global-notice').textContent=e.message}}
async function write(url,method,action,value){const r=checkSession(await fetch(url,{method,headers:{'Content-Type':'application/json','X-Suishi-Action':action},body:JSON.stringify(value)}));if(!r.ok)throw new Error('保存失败：'+r.status);return r.json()}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>tab(b.dataset.tab));
</script><script src="/simulation.js?v=20261122-2"></script><script src="/forwarding.js?v=20261122-2"></script><script src="/administration.js?v=20261122-2"></script><script src="/settings.js?v=20261122-2"></script></html>
