<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>邃室SuiShi · 用户登录</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f6fb;color:#20304b;font:15px 'Microsoft YaHei',sans-serif}form{background:white;border:1px solid #e0e7f0;border-radius:16px;padding:36px;width:min(400px,94vw)}input,button{width:100%;padding:12px;margin:10px 0;border:1px solid #cbd5e1;border-radius:8px}button{background:#325ee7;color:white;cursor:pointer}#notice{color:#b42318}</style>
<form id="login"><h1>邃室SuiShi</h1><p>蜜罐管理平台</p><label>用户名<input id="username" autocomplete="username" required maxlength="64"></label><label>密码<input id="password" type="password" autocomplete="current-password" required maxlength="256"></label><button>登录</button><p id="notice" role="status"></p></form>
<script>if(new URLSearchParams(location.search).get('reason')==='expired')document.getElementById('notice').textContent='登录已失效，请重新登录';document.getElementById('login').onsubmit=async e=>{e.preventDefault();try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json','X-Suishi-Action':'login'},body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})});if(!r.ok){const d=await r.json();throw new Error(typeof d.detail==='string'?d.detail:'登录失败')}location.replace('/')}catch(e){document.getElementById('notice').textContent=e.message}};</script></html>
